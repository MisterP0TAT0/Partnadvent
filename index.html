<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Advent Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,500&family=Lora:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--red:#7a1420;--rb:#c8282f;--green:#1f5a3d;--gold:#e6b34a;--cream:#f3ead8;--ink:#3a1a1a;--serif:'Playfair Display',Georgia,serif;--body:'Lora',Georgia,serif}
*{box-sizing:border-box;margin:0}
body{background:#f6f1e7;color:var(--ink);font-family:var(--body);padding:max(14px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom));min-height:100vh}
main{max-width:520px;margin:0 auto}
.hero{position:relative;overflow:hidden;text-align:center;color:#fff;background:linear-gradient(160deg,#8d1a28,#6a0f1b);border-radius:34px;padding:58px 18px 30px;box-shadow:0 10px 26px rgba(90,10,20,.3)}
.lights{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:space-around;border-top:1px solid rgba(255,255,255,.25);margin:0 8px}
.lights i{width:11px;height:11px;border-radius:50%;margin-top:-2px;animation:tw 2.4s infinite alternate}
@keyframes tw{to{opacity:.45}}
.hero p.k{font-size:.78rem;letter-spacing:.25em;text-transform:uppercase;opacity:.85}
.hero h1{font:italic 500 2.6rem/1.15 var(--serif);margin:10px 0 6px}
.hero p.f{font-size:1.1rem;opacity:.95}
.hero p.s{margin-top:14px;color:#f7d98b;font-size:.95rem}
.snow{position:absolute;top:-10px;color:#fff;opacity:.8;animation:fall linear infinite;pointer-events:none}
@keyframes fall{to{transform:translateY(300px) rotate(180deg)}}
.banner{margin:12px 0 0;text-align:center;font-size:.85rem;background:#fff3cf;border-radius:12px;padding:8px}
.panel{margin-top:16px;background:#ece2cb;border-radius:28px;padding:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:var(--u);grid-auto-flow:dense;gap:8px;--u:calc((min(100vw - 28px,520px) - 48px)/4)}
.door{position:relative;border:0;border-radius:16px;cursor:pointer;overflow:hidden;color:#fff;font:800 1.7rem var(--serif);transition:transform .2s;text-shadow:0 2px 3px rgba(0,0,0,.35);background-size:cover;background-position:center;text-align:left;padding:0}
.door:focus-visible{outline:3px solid #1a57d6;outline-offset:2px}
.door.w{grid-column:span 2}.door.t{grid-row:span 2}.door.b{grid-column:span 2;grid-row:span 2;font-size:2.8rem}.door.f{grid-column:span 4}.door.t{font-size:2.2rem}
.door::before{content:"";position:absolute;inset:5px;border:1.5px dashed rgba(255,255,255,.75);border-radius:14px;pointer-events:none;z-index:2}
.num{position:absolute;left:14px;top:8px;z-index:3;line-height:1}
.knob{position:absolute;right:12px;bottom:12px;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,#d89a2b 65%,#a3701a);box-shadow:0 1px 3px rgba(0,0,0,.5);z-index:3}
.bow{display:none;position:absolute;left:50%;top:50%;z-index:2}
.bow::before,.bow::after{content:"";position:absolute;width:26px;height:16px;background:var(--rb);border-radius:60% 40%;top:-14px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.bow::before{left:-25px;transform:rotate(-22deg)}.bow::after{left:-1px;transform:rotate(22deg) scaleX(-1)}
.bow b{position:absolute;left:-5px;top:-9px;width:10px;height:10px;border-radius:50%;background:#a81d24}
.c0,.c3{--r:var(--rb)}.c3{--r:#f4eadb}
.c0{background:linear-gradient(90deg,transparent 45%,var(--r) 45% 55%,transparent 55%),linear-gradient(0deg,transparent 45%,var(--r) 45% 55%,transparent 55%),var(--green)}
.c3{background:linear-gradient(90deg,transparent 45%,var(--r) 45% 55%,transparent 55%),linear-gradient(0deg,transparent 45%,var(--r) 45% 55%,transparent 55%),#a3202c}
.c0 .bow,.c3 .bow{display:block}.c3 .bow::before,.c3 .bow::after{background:#f4eadb}.c3 .bow b{background:#d9ccb4}
.c1{background:repeating-linear-gradient(135deg,#fff 0 9px,#c8282f 9px 18px);color:var(--red);text-shadow:0 0 6px #fff,0 0 3px #fff}
.c2{background:radial-gradient(circle,#f5d36b 1.6px,transparent 2.2px) 0 0/30px 30px,radial-gradient(circle,#fff8 1px,transparent 1.5px) 15px 15px/30px 30px,#232d78}
.c4{background:radial-gradient(circle,#fff 3px,transparent 3.5px) 0 0/24px 24px,linear-gradient(#dbe8f7,#c3d6ef);color:#25489a;text-shadow:0 0 4px #fff}
.door.ready{animation:glow 1.8s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 0 3px var(--gold),0 0 8px 2px rgba(255,196,70,.6)}to{box-shadow:0 0 0 3px #ffd56b,0 0 22px 8px rgba(255,196,70,.95)}}
.door.open{background:#faf4e6;color:var(--red);text-shadow:none;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:8px 6px;text-align:center;font:600 .78rem/1.2 var(--body)}
.door.open.w,.door.open.f{flex-direction:row;justify-content:center;gap:12px}
.door.open .num{font:800 1.4rem/1 var(--serif)}.door.open.s{font-size:.6rem}.door.open.s .ic{font-size:1.3rem}.door.open.s small{display:none}
.door.open::before{border-color:rgba(122,20,32,.25)}
.door.open .num{color:var(--red)}.door.open .ic{font-size:1.7rem;margin-bottom:2px}
.door.open.img{color:#fff;text-shadow:0 1px 3px #000}.door.open.img .num,.door.open.img .cap{background:rgba(250,244,230,.9);color:var(--red);text-shadow:none;border-radius:8px;padding:1px 6px}
.door.open.img::after{display:none}
.door.open>*{position:relative;z-index:3}.door.open .num{position:absolute}
.door.open small{display:block;font-weight:400;opacity:.8;font-size:.68rem}
.door.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,80px);background:#3a1a1a;color:#fff;padding:10px 16px;border-radius:99px;font-size:.9rem;transition:.3s;z-index:20}
#toast.on{transform:translate(-50%,0)}
#ov{position:fixed;inset:0;background:rgba(40,8,12,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#ov.on{display:flex}
.card{background:#fbf6ea;border-radius:26px;max-width:480px;width:100%;max-height:90vh;overflow:auto;padding:26px 22px 24px;position:relative;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.card h2{font:italic 600 1.6rem/1.2 var(--serif);color:var(--red);margin:2px 44px 14px 0}
.card .d{font-size:.85rem;opacity:.7}
.card img,.card video{width:100%;border-radius:14px;margin-bottom:12px;display:block}
.card audio{width:100%;margin:6px 0 12px}
.card p{line-height:1.65;margin-bottom:10px;white-space:pre-wrap}
.card .poem{font-style:italic;font-size:1.1rem;text-align:center;line-height:1.9}
.x{position:absolute;top:10px;right:10px;z-index:5;width:44px;height:44px;border:0;border-radius:50%;background:#efe3cc;color:var(--red);font:400 1.8rem/1 var(--body);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}.x:hover{background:#e6d5b4}
.btn{display:inline-block;background:#1db954;color:#fff;text-decoration:none;padding:9px 16px;border-radius:99px;font-weight:600;margin:4px 0 12px}
.ticket{border:2px dashed var(--rb);border-radius:16px;text-align:center;padding:22px 12px;margin-bottom:12px;background:#fff}
.ticket .big{font:800 1.5rem var(--serif);color:var(--red)}
.note{font:italic 600 1.5rem/1.4 var(--serif);text-align:center;color:var(--green);padding:14px 0}
.grid.intro .door{animation:drop .55s cubic-bezier(.2,1.3,.4,1) backwards;animation-delay:calc(var(--i)*45ms)}
.grid.intro .door.ready{animation:drop .55s cubic-bezier(.2,1.3,.4,1) backwards,glow 1.8s ease-in-out infinite alternate;animation-delay:calc(var(--i)*45ms),calc(var(--i)*45ms + .6s)}
@keyframes drop{from{opacity:0;transform:translateY(-28px) scale(.8) rotate(-5deg)}}
.door:hover{transform:translateY(-3px) rotate(-1deg)}.door:active{transform:scale(.96)}
.door.ready .bow{animation:wig 2.4s ease-in-out infinite}
@keyframes wig{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-12deg)}80%{transform:rotate(9deg)}90%{transform:rotate(-4deg)}}
.door.swing{transform-origin:left center}
.door.ready.swing{animation:swing .55s ease-in forwards}
@keyframes swing{to{transform:perspective(500px) rotateY(-100deg);opacity:.15}}
.door.flip{animation:flip .7s cubic-bezier(.2,1.2,.4,1) backwards}
@keyframes flip{from{transform:perspective(500px) rotateY(90deg);opacity:0}}
.hero h1{animation:rise .9s .1s backwards}
@keyframes rise{from{opacity:0;transform:translateY(14px);letter-spacing:.14em}}
.pt{position:fixed;z-index:15;pointer-events:none;font-size:16px;animation:pt 1s ease-out forwards}
@keyframes pt{to{transform:translate(var(--dx),calc(var(--dy) + 60px)) rotate(240deg) scale(.4);opacity:0}}
.banner input,.banner button{font:inherit;padding:3px 8px;border-radius:8px;border:1px solid #d8b86a;background:#fff;margin:2px}
.door.ready{box-shadow:0 0 0 3px var(--gold),0 0 14px 4px rgba(255,196,70,.8)}
#login{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#8d1a28,#6a0f1b)}
#login[hidden]{display:none}
#lf{background:#fbf6ea;border-radius:26px;padding:28px 22px;width:100%;max-width:360px;text-align:center;display:flex;flex-direction:column;gap:12px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
#lf h2{font:italic 600 2rem var(--serif);color:var(--red)}
#lf .k{font-size:.75rem;letter-spacing:.25em;text-transform:uppercase;color:var(--red);opacity:.8}
#lf input{font:inherit;padding:12px 14px;border-radius:12px;border:1px solid #d8b86a;background:#fff;width:100%}
#lf button{font:600 1rem var(--body);padding:12px;border:0;border-radius:99px;background:var(--red);color:#fff;cursor:pointer}
#le{color:#a3202c;font-size:.9rem;min-height:1.2em}
.so{text-align:center;margin-top:14px;font-size:.8rem}.so a{color:var(--ink);opacity:.6}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<main hidden>
  <header class="hero" id="hero"></header>
  <div id="banner"></div>
  <section class="panel"><div class="grid" id="grid"></div></section>
  <p class="so"><a href="#" id="so">Sign out</a></p>
</main>
<div id="login" hidden><form id="lf"><p class="k">An advent calendar</p><h2 id="lt"></h2>
<input id="em" type="email" placeholder="Email" autocomplete="username" required>
<input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
<button>Open</button><p id="le"></p></form></div>
<div id="ov"><div class="card" id="card" role="dialog" aria-modal="true"></div></div>
<div id="toast"></div>

<script>
/* ============ SETTINGS ============ */
const C = {
  name: "Molly",
  from: "Keshav",
  year: 2026,
  total: 25,
  url: "https://npvylxclywcfwrnfoeef.supabase.co",  // e.g. https://abcdefgh.supabase.co
  key: "sb_publishable_tFfFfAd4PfY6yP2qaQK1sg_m_LtmXeJ"  // public key: safe to keep in the repo
};
let sb = null;
try { sb = supabase.createClient(C.url, C.key); } catch (e) {}

const $ = s => document.querySelector(s);
const SZ = 'ssw' + 'tsssws' + 'bssss' + 'wtssss' + 'ssbw' + 'f'; // s=1x1 w=2x1 t=1x2 b=2x2 f=full row
const ICON = {photo:'📷',video:'🎬',music:'🎵',note:'💌',voucher:'☕',poem:'📜',message:'💬',gift:'🎁'};
const MONTH = new Date(C.year, 11, 1).toLocaleString('en-GB', {month: 'short'});
const esc = v => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D = {}, opened = {}, me = null, giver = false, testDate = '', intro = true, fresh = 0, peek = {}, pend = false, timer = null;

const today = () => { const d = testDate ? new Date(testDate + 'T12:00:00') : new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const doorDate = n => new Date(C.year, 11, n);
const fmt = ts => new Date(+ts).toLocaleDateString('en-GB', {day: 'numeric', month: 'short'});
const bucket = () => sb.storage.from('calendar-media');

/* ============ LOGIN ============ */
$('#lt').textContent = 'For ' + C.name;
function showLogin(msg) { $('main').hidden = true; $('#login').hidden = false; $('#le').textContent = msg || ''; }
async function boot() {
  if (!sb) return showLogin('Add your Supabase Project URL near the top of index.html.');
  const {data} = await sb.auth.getSession();
  data.session ? start(data.session.user) : showLogin();
}
$('#lf').onsubmit = async e => {
  e.preventDefault(); $('#le').textContent = '';
  const {data, error} = await sb.auth.signInWithPassword({email: $('#em').value.trim(), password: $('#pw').value});
  if (error) return $('#le').textContent = 'That email or password is not right.';
  start(data.user);
};
$('#so').onclick = async e => { e.preventDefault(); await sb.auth.signOut(); location.reload(); };

async function start(user) {
  me = user; $('#login').hidden = true; $('main').hidden = false;
  const r = await sb.rpc('my_role');
  if (r.error) toast('Could not read your role. Run the extra SQL step.');
  giver = r.data === 'organiser';
  tools(); await load(); render();
  if (!timer) timer = setInterval(async () => {
    if ($('#ov').classList.contains('on') || document.hidden) return;
    const before = sig(); await load(); if (sig() !== before) render();
  }, 30000);
}
const sig = () => Object.keys(opened).join() + '|' + Object.keys(D).length + '|' + (+today()) + '|' + Math.floor(Date.now() / 3000000);

/* ============ DATA ============ */
async function load() {
  const [d, o] = await Promise.all([sb.from('calendar_days').select('*').order('day'), sb.from('calendar_opens').select('day,opened_at')]);
  if (d.error || o.error) return toast('Could not load the calendar. Check your connection.');
  opened = {}; (o.data || []).forEach(r => opened[r.day] = Date.parse(r.opened_at));
  D = {};
  (d.data || []).forEach(r => D[r.day] = {t: ({image: 'photo', song: 'music'})[r.type] || r.type, title: r.title, text: r.message, path: r.media_path, spotify: r.spotify_url, tp: r.thumb_path || ((r.type === 'image' || r.type === 'gift') ? r.media_path : ''), fit: r.thumb_fit === 'cover' ? 'cover' : 'contain'});
  const pics = Object.values(D).filter(x => x.tp);
  if (pics.length) {
    const {data} = await bucket().createSignedUrls(pics.map(x => x.tp), 3600);
    (data || []).forEach(u => pics.forEach(x => { if (x.tp === u.path && u.signedUrl) x.thumb = u.signedUrl; }));
  }
}
async function save(n) {
  const {error} = await sb.from('calendar_opens').insert({day: n, opened_by: me.id});
  if (error && error.code !== '23505') return toast('Could not save that. Please try again.');
  opened[n] = Date.now();
}

/* ============ RENDER ============ */
function render() {
  const t = today(), days = [...Array(C.total)].map((_, i) => i + 1);
  const waiting = days.filter(n => doorDate(n) <= t && !opened[n]).length;
  const dayNo = Math.min(Math.max(Math.round((t - doorDate(1)) / 864e5) + 1, 0), C.total);
  const status = dayNo === 0 ? `The first door opens on 1 ${MONTH}`
    : `Day ${dayNo} of ${C.total} · ` + (waiting ? `${waiting} door${waiting > 1 ? 's are' : ' is'} waiting` : 'all caught up');
  if ($('#hero .s')) $('#hero .s').textContent = status; else {
    $('#hero').innerHTML = `<div class="lights"></div><p class="k">An advent calendar</p><h1>For ${esc(C.name)}</h1><p class="f">with love from ${esc(C.from)}</p><p class="s">${status}</p>`;
    const L = $('.lights');
    for (let i = 0; i < 14; i++) { const b = document.createElement('i'); b.style.background = ['#ffd23f','#ff5b5b','#59d36b','#4aa8ff','#ff9f43'][i % 5]; b.style.animationDelay = (i * .3) + 's'; L.append(b); }
    for (let i = 0; i < 18; i++) { const s = document.createElement('span'); s.className = 'snow'; s.textContent = '❄'; s.style.cssText = `left:${Math.random()*100}%;font-size:${8+Math.random()*10}px;animation-duration:${6+Math.random()*8}s;animation-delay:-${Math.random()*10}s`; $('#hero').append(s); }
  }
  $('#grid').className = 'grid' + (intro ? ' intro' : ''); intro = false;
  $('#grid').innerHTML = days.map(n => {
    const x = D[n] || {t: 'note', title: '', text: ''}, isOpen = !!opened[n] || (giver && !!peek[n]), ready = doorDate(n) <= t, w = ' ' + SZ[n - 1];
    if (isOpen) {
      const im = x.thumb || '';
      return `<button class="door open${im ? ' img' : ''}${w}${n === fresh ? ' flip' : ''}" data-n="${n}" style="--i:${n};${im ? `background:#faf4e6 url('${im}') center/${x.fit || 'contain'} no-repeat` : ''}" aria-label="Day ${n}, opened"><span class="num">${n}</span>${im ? '' : `<span class="ic">${ICON[x.t]}</span>`}<span class="cap">${esc(x.title)}<small>${giver ? (opened[n] ? 'Opened ' + fmt(opened[n]) : 'Preview only') : ''}</small></span></button>`;
    }
    return `<button class="door c${n % 5}${w}${ready ? ' ready' : ''}" data-n="${n}" style="--i:${n}" aria-label="Day ${n}, ${ready ? 'ready to open' : 'locked'}"><span class="num">${n}</span><span class="bow"><b></b></span><i class="knob"></i></button>`;
  }).join('');
}

function body(x) {
  const tx = x.text ? `<p>${esc(x.text)}</p>` : '', u = x.url || '';
  switch (x.t) {
    case 'photo': case 'gift': return (u ? `<img src="${u}" alt="">` : '') + tx;
    case 'video': return (u ? `<video controls playsinline preload="metadata" src="${u}"></video>` : '') + tx;
    case 'music': return (u ? `<audio controls src="${u}"></audio>` : '') + (/^https:\/\//.test(x.spotify || '') ? `<a class="btn" href="${esc(x.spotify)}" target="_blank" rel="noopener">Listen on Spotify</a>` : '') + tx;
    case 'note': return `<div class="note">${esc(x.text).replace(/\n/g, '<br>')}</div>`;
    case 'voucher': return `<div class="ticket"><div class="big">☕ Voucher</div><p style="margin:6px 0 0">Redeem in person, any time.</p></div>` + tx;
    case 'poem': return `<p class="poem">${esc(x.text)}</p>`;
    case 'message': return (u ? `<audio controls src="${u}"></audio>` : '') + tx;
  }
  return tx;
}
async function show(n) {
  const x = D[n]; if (!x) return;
  if (x.path) { const {data} = await bucket().createSignedUrl(x.path, 3600); x.url = data && data.signedUrl; }
  $('#card').innerHTML = `<button class="x" aria-label="Close">×</button><div class="d">${n} ${MONTH}</div><h2>${esc(x.title)}</h2>${body(x)}`;
  $('#ov').classList.add('on'); $('#card .x').focus();
}
function close() {
  $('#ov').classList.remove('on'); $('#card').innerHTML = '';
  if (pend) { pend = false; render(); setTimeout(() => fresh = 0, 900); }
}
function nope(n) {
  const days = Math.round((doorDate(n) - today()) / 864e5), d = doorDate(n).toLocaleDateString('en-GB', {weekday: 'long', day: 'numeric', month: 'long'});
  $('#card').innerHTML = `<button class="x" aria-label="Close">×</button><h2>Not yet!</h2><p>${days > 0 ? `This door opens on ${d}. That's ${days === 1 ? 'tomorrow' : days + ' days away'}.` : 'This door is not quite ready. Try again in a moment.'}</p>`;
  $('#ov').classList.add('on'); $('#card .x').focus();
}
function toast(m) { const e = $('#toast'); e.textContent = m; e.classList.add('on'); setTimeout(() => e.classList.remove('on'), 2600); }

$('#grid').addEventListener('click', async e => {
  const b = e.target.closest('.door'); if (!b) return;
  const n = +b.dataset.n;
  if (b.classList.contains('swing')) return;
  if (b.classList.contains('open')) return show(n);
  if (doorDate(n) > today() || !D[n]) { b.classList.add('shake'); setTimeout(() => b.classList.remove('shake'), 400); return nope(n); }
  burst(b); b.classList.add('swing');
  await new Promise(r => setTimeout(r, 550));
  await show(n);
  fresh = n; pend = true;
  if (!giver) await save(n); else peek[n] = 1;
});
$('#ov').addEventListener('click', e => { if (e.target.id === 'ov' || e.target.classList.contains('x')) close(); });
addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

function burst(el) {
  const r = el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
  for (let i = 0; i < 24; i++) {
    const p = document.createElement('span'), a = Math.random() * 6.28, d = 50 + Math.random() * 90;
    p.className = 'pt'; p.textContent = ['✦','❄','✿','•'][i % 4];
    p.style.cssText = `left:${x}px;top:${y}px;color:${['#ffd23f','#ff5b5b','#59d36b','#4aa8ff','#e6b34a'][i % 5]};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d - 30}px`;
    document.body.append(p); setTimeout(() => p.remove(), 1000);
  }
}
// Organiser tools: date picker, previews, reset
function tools() {
  if (!giver) return;
  const iso = d => d.toISOString().slice(0, 10);
  $('#banner').innerHTML = `<div class="banner">Organiser view: doors you open here are a preview only and are not saved.<br>Pretend today is <input type="date" id="td" value="${iso(new Date())}"> <button id="tr">Use real date</button> <button id="cp">Clear previews</button> <button id="rs">Reset ${esc(C.name)}'s doors</button></div>`;
  $('#td').onchange = e => { testDate = e.target.value; intro = true; render(); };
  $('#tr').onclick = () => { testDate = ''; $('#td').value = iso(new Date()); intro = true; render(); };
  $('#cp').onclick = () => { peek = {}; intro = true; render(); };
  $('#rs').onclick = async () => {
    if (!confirm(`Reset all of ${C.name}'s opened doors?`)) return;
    const {error} = await sb.from('calendar_opens').delete().gte('day', 1);
    if (error) return toast('Could not reset.');
    opened = {}; render();
  };
}
boot();
</script>
</body>
</html>
